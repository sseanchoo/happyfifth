<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff9f6;
      color: #3f3535;

      font-family: Georgia, "Times New Roman", serif;
      text-align: center;

      padding: 32px;
    }

    .container {
      max-width: 420px;
    }

    .heart {
      font-size: 34px;
      margin-bottom: 35px;

      animation: pulse 2.5s infinite;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
      margin-bottom: 25px;

      opacity: 0;
      animation: fadeIn 1.5s forwards;
      animation-delay: 0.4s;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;

      opacity: 0;
      animation: fadeIn 1.5s forwards;
      animation-delay: 1.3s;
    }

    .date {
      margin-top: 50px;

      font-size: 13px;
      letter-spacing: 4px;

      opacity: 0;
      animation: fadeIn 1.5s forwards;
      animation-delay: 2.5s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">♡</div>

    <h1>You're early, silly beanie.</h1>

    <div class="message">
      How did you even find this?<br><br>

      Pretend you saw nothing.<br>
      You'll know when it's time.
    </div>

    <div class="date">
      27 · 12 · 26
    </div>

  </div>

</body>
</html>
